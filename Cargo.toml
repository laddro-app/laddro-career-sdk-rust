[package]
name = "laddro-career"
version = "0.2.0"
edition = "2021"
description = "Rust SDK for the Laddro Career API"
license = "MIT"
repository = "https://github.com/laddro-app/laddro-career-sdk-rust"
homepage = "https://docs.laddro.com"
keywords = ["laddro", "career", "resume", "api"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
